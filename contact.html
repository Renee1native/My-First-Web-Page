<main>
      
    <section id="contact">
        <h2>Contact Me</h2>

        <p>
            If you would like to get in touch, please fill out the form below.
        </p>

        <form id="contact-form" novalidate>

            <fieldset>
                <legend>Contact Information</legend>

                <div class="form-group">
                    <label for="contact-name">Full Name</label>

                    <input
                        type="text"
                        id="contact-name"
                        name="name"
                        autocomplete="name"
                        required
                        aria-describedby="contact-name-error">

                    <p id="contact-name-error" class="error-message"></p>
                </div>

                <div class="form-group">
                    <label for="contact-email">Email Address</label>

                    <input
                        type="email"
                        id="contact-email"
                        name="email"
                        autocomplete="email"
                        required
                        aria-describedby="contact-email-error">

                    <p id="contact-email-error" class="error-message"></p>
                </div>

                <div class="form-group">
                    <label for="subject">Subject</label>

                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        required
                        aria-describedby="subject-error">

                    <p id="subject-error" class="error-message"></p>
                </div>

                <div class="form-group">
                    <label for="contact-message">Message</label>

                    <textarea
                        id="contact-message"
                        name="message"
                        rows="6"
                        required
                        aria-describedby="contact-message-error"></textarea>

                    <p id="contact-message-error" class="error-message"></p>
                </div>

                <button type="submit">Send Message</button>

                <p id="success-message" class="success-message"></p>

            </fieldset>

        </form>
    </section>
</main>
