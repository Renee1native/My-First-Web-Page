<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Renee Herrera - IT Student</title>

    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Open+Sans:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Renee Herrera - IT Student</h1>

        <nav>
            <ul>
                <li><a href="#about">About Me</a></li>
                <li><a href="#future">Future</a></li>
                <li><a href="#skills">Skills</a></li>
                <li><a href="#contact">Contact Me</a></li>
            </ul>
        </nav>
    </header>


    <!-- Main Content -->
    


        <!-- Contact Form -->
        <section id="contact" class="full-width">
            <h3>Contact Me</h3>

            <p>
                If you would like to get in touch, please fill out the form below.
            </p>

            <form id="contact-form" novalidate>

                <fieldset>
                    <legend>Contact Information</legend>

                    <!-- Full Name -->
                    <div class="form-group">
                        <label for="contact-name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="contact-name"
                            name="name"
                            autocomplete="name"
                            required
                            aria-describedby="contact-name-error">

                        <p
                            id="contact-name-error"
                            class="error-message">
                        </p>
                    </div>


                    <!-- Email -->
                    <div class="form-group">
                        <label for="contact-email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="contact-email"
                            name="email"
                            autocomplete="email"
                            required
                            aria-describedby="contact-email-error">

                        <p
                            id="contact-email-error"
                            class="error-message">
                        </p>
                    </div>


                    <!-- Subject -->
                    <div class="form-group">
                        <label for="subject">
                            Subject
                        </label>

                        <input
                            type="text"
                            id="subject"
                            name="subject"
                            required
                            aria-describedby="subject-error">

                        <p
                            id="subject-error"
                            class="error-message">
                        </p>
                    </div>


                    <!-- Message -->
                    <div class="form-group">
                        <label for="contact-message">
                            Message
                        </label>

                        <textarea
                            id="contact-message"
                            name="message"
                            rows="6"
                            required
                            aria-describedby="contact-message-error"></textarea>

                        <p
                            id="contact-message-error"
                            class="error-message">
                        </p>
                    </div>


                    <!-- Submit -->
                    <button type="submit">
                        Send Message
                    </button>

                    <p
                        id="success-message"
                        class="success-message">
                    </p>

                </fieldset>

            </form>
        </section>
    </main>


    <!-- Footer -->
    <footer>
        <p>
            &copy; 2026 Renee Herrera. All rights reserved.
        </p>
    </footer>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
